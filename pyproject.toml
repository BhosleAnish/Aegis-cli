[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-cli"
version = "0.1.0"
description = "Automation-first VAPT / infrastructure / SAST scanner for authorized security engagements — command line only"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "PyYAML>=6.0",
    "defusedxml>=0.7.1",   # safe parsing of nmap XML (guards XXE / entity-expansion)
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
pdf = ["markdown>=3.4", "xhtml2pdf>=0.2.11"]   # enables `--pdf` report export

[project.scripts]
aegis = "aegis.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["aegis*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
